name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.36' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.36' }}"
          releaseBody: |
            **Pin v0.1.36** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.36

            **Drag & drop for the whole library (issue #46):**
            - **Drag notes into any folder** — grab a note row and drop it on a folder; it moves there instantly and stays saved
            - **Drag folders to arrange** — drop on the top or bottom edge of another folder to reorder siblings
            - **Nest folders** — drop a folder in the middle of another folder to put it inside; nested folders indent and can go deeper
            - **Drag notes to arrange** — drop a note on the top/bottom edge of another note in the same folder to set your own order; the order persists across restarts
            - **Drop a folder onto a note** to file the folder where that note lives
            - Cycle protection: a folder can never be dropped inside itself or one of its own subfolders
            - Clear drop hints: dashed accent outline = drop inside, accent bar = reorder above/below

            Everything from v0.1.35 is kept: command palette, graph view, trash, favorites, pinned notes, quick capture, Quick Note window, web clipper, tray, ZIP backup, reminders + Inbox, 12 colors.

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Diagnose Windows bundle failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis > diag-nsis.log 2>&1 || true
          npm run tauri build -- --bundles msi > diag-msi.log 2>&1 || true
          { grep -iE "error|failed|panicked" diag-nsis.log | tail -n 25; grep -iE "error|failed|panicked" diag-msi.log | tail -n 25; tail -n 20 diag-msi.log; } > hits.txt || true
          awk 'length($0)>0' hits.txt | tail -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
